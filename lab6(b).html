<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>

    h2{
      text-align: center;
    }
    .photo
    {
      width:20%;
    }
    .photo img{
      width:80%;
      background-color:rgb(130, 118, 238);
      border-radius: 20px;
    }
    .photo img:hover
    {
      transform: skewX(20deg);
    }
    .gallery
    {
      display:flex;
      gap:30px;
      flex-wrap: wrap;
      justify-content: center;

    }
    @media (max-width:600px) {
        .photo
        {
          width: 30%;
        }
    }
    @media (max-width:300px) {
        .photo
        {
          width: 50%;
        }
    }
  </style>
</head>
<body>
  <h2>Photo Gallery</h2>
  <div class="gallery">

        <div class="photo"><img src="sheep.png" alt="Photo 1"></div>
        <div class="photo"><img src="happy (1).png" alt="Photo 2"></div>
        <div class="photo"><img src="koala.png" alt="Photo 3"></div>
        <div class="photo"><img src="butterfly.png" alt="Photo 4"></div>
        <div class="photo"><img src="perch.png" alt="Photo 5"></div>
        <div class="photo"><img src="dinosaur.png" alt="Photo 6"></div>
        <div class="photo"><img src="happy.png" alt="Photo 7"></div>
        <div class="photo"><img src="monkey.png" alt="Photo 8"></div>

    </div>
</body>
</html>
